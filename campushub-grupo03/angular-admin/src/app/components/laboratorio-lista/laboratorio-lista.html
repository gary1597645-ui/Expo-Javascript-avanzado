<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestión de Laboratorios</h2>
    <a routerLink="/laboratorios/nuevo" class="btn btn-success">Crear Nuevo</a>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Sede</th>
                <th>Capacidad</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Usamos la sintaxis moderna de Angular que nunca falla -->
            @for (lab of laboratorios; track lab.id) {

            <!-- 1. AQUÍ AGREGAMOS LA DIRECTIVA PERSONALIZADA AL TR -->
            <tr [appResaltarEstado]="lab.estado">

                <td>{{ lab.id }}</td>
                <td>{{ lab.nombre }}</td>
                <td>{{ lab.sede }}</td>
                <td>{{ lab.capacidad }}</td>
                <td>
                    <span class="badge"
                        [ngClass]="{'bg-success': lab.estado === 'disponible', 'bg-warning text-dark': lab.estado === 'mantenimiento'}">
                        {{ lab.estado | uppercase }}
                    </span>
                </td>
                <td>
                    <!-- 2. AQUÍ AGREGAMOS EL BOTÓN "VER" AL INICIO DE LOS BOTONES -->
                    <a [routerLink]="['/laboratorios', lab.id]" class="btn btn-info btn-sm me-2 text-white">Ver</a>
                    <a [routerLink]="['/laboratorios', lab.id, 'editar']" class="btn btn-primary btn-sm me-2">Editar</a>
                    <button (click)="eliminar(lab.id)" class="btn btn-danger btn-sm">Eliminar</button>
                </td>
            </tr>
            } @empty {
            <tr>
                <td colspan="6" class="text-center py-4 text-muted">No hay laboratorios registrados en el sistema.</td>
            </tr>
            }
        </tbody>
    </table>
</div>
